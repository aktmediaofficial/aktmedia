# One Render web service that serves BOTH the website and the /api (playlists).
services:
  - type: web
    name: aktmedia
    runtime: node
    plan: free
    # NODE_ENV=development is only for `pnpm install` so dev dependencies (vite, esbuild...)
    # are installed; the app itself still runs with NODE_ENV=production (see envVars).
    buildCommand: NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter @workspace/akt-media run build && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # your Render Postgres "Internal Database URL"
        sync: false
      - key: SESSION_SECRET # signs the anonymous playlist-session cookie
        generateValue: true
      - key: S3_BUCKET # private R2/S3 bucket for the lossless WAV masters
        sync: false
      - key: S3_ENDPOINT # R2: https://<account-id>.r2.cloudflarestorage.com ; B2: https://s3.<region>.backblazeb2.com
        sync: false
      - key: S3_REGION # B2: the region from the endpoint, e.g. us-west-004 ; R2: auto
        sync: false
      - key: S3_ACCESS_KEY_ID # B2 Application Key ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY # B2 Application Key
        sync: false
      - key: S3_FORCE_PATH_STYLE # safe for Backblaze B2
        value: "true"
      - key: S3_KEY_PREFIX # optional, e.g. audio
        value: ""
