openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: playlists
    description: Private playlist operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /playlists:
    get:
      operationId: listPlaylists
      tags: [playlists]
      summary: List the current browser's playlists
      responses:
        "200":
          description: Playlists ordered by most recently updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Playlist"
    post:
      operationId: createPlaylist
      tags: [playlists]
      summary: Create a playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistInput"
      responses:
        "201":
          description: Playlist created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /playlists/{playlistId}:
    parameters:
      - name: playlistId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPlaylist
      tags: [playlists]
      summary: Get a playlist
      responses:
        "200":
          description: Playlist details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePlaylist
      tags: [playlists]
      summary: Update playlist details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistUpdate"
      responses:
        "200":
          description: Playlist updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deletePlaylist
      tags: [playlists]
      summary: Delete a playlist and its tracks
      responses:
        "204":
          description: Playlist deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /playlists/{playlistId}/tracks:
    parameters:
      - name: playlistId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: addTrackToPlaylist
      tags: [playlists]
      summary: Add a library track to a playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistTrackInput"
      responses:
        "201":
          description: Track added; an existing track is returned unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /playlists/{playlistId}/tracks/{trackId}:
    parameters:
      - name: playlistId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: trackId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    delete:
      operationId: removeTrackFromPlaylist
      tags: [playlists]
      summary: Remove a track from a playlist
      responses:
        "200":
          description: Playlist after removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "404":
          $ref: "#/components/responses/NotFound"
  /playlists/{playlistId}/track-order:
    parameters:
      - name: playlistId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: reorderPlaylistTracks
      tags: [playlists]
      summary: Set the exact order of playlist tracks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistTrackOrderInput"
      responses:
        "200":
          description: Playlist with updated track order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Playlist not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Playlist limit reached or a conflicting request was made
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Playlist:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        trackCount:
          type: integer
          minimum: 0
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/PlaylistTrack"
      required: [id, name, description, createdAt, updatedAt, trackCount, tracks]
    PlaylistTrack:
      type: object
      properties:
        trackId:
          type: integer
          minimum: 1
        position:
          type: integer
          minimum: 0
        addedAt:
          type: string
          format: date-time
      required: [trackId, position, addedAt]
    PlaylistInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
      required: [name]
    PlaylistUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: ["string", "null"]
          maxLength: 500
    PlaylistTrackInput:
      type: object
      properties:
        trackId:
          type: integer
          minimum: 1
      required: [trackId]
    PlaylistTrackOrderInput:
      type: object
      properties:
        trackIds:
          type: array
          uniqueItems: true
          maxItems: 500
          items:
            type: integer
            minimum: 1
      required: [trackIds]

