services:
  - type: web
    name: aktmedia
    env: node
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && cd artifacts/akt-media && pnpm run build
    startCommand: cd artifacts/akt-media && pnpm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
